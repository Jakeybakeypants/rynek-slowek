<title>Rynek Słówek</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: the market square fills the screen; glazed-stoneware panels (Bolesławiec white glaze, cobalt rim, peacock-eye dots) float at its edges */
:root{
  --glaze:#F6F8FC; --glaze-2:#E6ECF8; --rim:#1F3C91; --ink:#16224B; --ink-2:#4C5A86;
  --gold:#E9B53B; --on-gold:#2A1D00; --sky:#BFD9F2;
  --known:#1C8748; --learning:#C95A04; --new:#7638D3;
  --known-t:#DDF2E4; --learning-t:#FCE6D2; --new-t:#ECE2FB; --on-status:#FFFFFF;
  --veil:rgba(14,22,52,.42); --shadow:0 12px 32px rgba(18,30,70,.22); --stick:rgba(246,248,252,.55);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --top:calc(env(safe-area-inset-top, 0px) + 12px);
  --bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glaze:#121A38; --glaze-2:#1B2752; --rim:#9DB8FF; --ink:#EEF2FF; --ink-2:#AEB9DE;
  --gold:#E9B53B; --on-gold:#2A1D00; --sky:#1B2A5C;
  --known:#55D68F; --learning:#FFA052; --new:#BE98FF;
  --known-t:rgba(85,214,143,.16); --learning-t:rgba(255,160,82,.16); --new-t:rgba(190,152,255,.18); --on-status:#0E1533;
  --veil:rgba(5,9,25,.6); --shadow:0 12px 32px rgba(0,0,0,.45); --stick:rgba(18,26,56,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --glaze:#121A38; --glaze-2:#1B2752; --rim:#9DB8FF; --ink:#EEF2FF; --ink-2:#AEB9DE;
  --gold:#E9B53B; --on-gold:#2A1D00; --sky:#1B2A5C;
  --known:#55D68F; --learning:#FFA052; --new:#BE98FF;
  --known-t:rgba(85,214,143,.16); --learning-t:rgba(255,160,82,.16); --new-t:rgba(190,152,255,.18); --on-status:#0E1533;
  --veil:rgba(5,9,25,.6); --shadow:0 12px 32px rgba(0,0,0,.45); --stick:rgba(18,26,56,.6); color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--rim);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene.dragging{cursor:grabbing}

/* status colours: purple new, orange learning, green known */
[data-s="0"]{--c:var(--new);--t:var(--new-t)}
[data-s="1"]{--c:var(--learning);--t:var(--learning-t)}
[data-s="2"]{--c:var(--known);--t:var(--known-t)}

.glaze{background:var(--glaze);color:var(--ink);border:2px solid var(--rim);border-radius:16px;box-shadow:var(--shadow);position:relative}
.dots::before{content:"";position:absolute;left:14px;right:14px;top:7px;height:6px;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 3px 3px,var(--rim) 2.1px,transparent 2.7px) 0 0/12px 6px repeat-x}
.eye{display:inline-block;width:18px;height:18px;border-radius:50%;flex:none;
  background:radial-gradient(circle,var(--rim) 0 3px,var(--glaze) 3px 5px,var(--rim) 5px 7px,transparent 7.5px)}

/* world labels */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.lbl{position:absolute;left:0;top:0;will-change:transform}
.wl{pointer-events:auto;font:700 15px/1 var(--body);color:var(--c);background:var(--glaze);border:2px solid var(--c);border-radius:999px;
  padding:5px 10px 5px 8px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(10,20,50,.28);cursor:pointer;white-space:nowrap;transition:transform .15s}
.wl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.wl:hover{transform:translateY(-2px)}
.wl.sign{font:800 14px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border-radius:8px;padding:6px 10px 4px}
.wl.small{font-size:13px;padding:3px 8px 3px 6px}
.wl.near{transform:scale(1.15);box-shadow:0 0 0 4px var(--t),0 6px 16px rgba(10,20,50,.3)}
.npc-tag{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.npc-tag .mark{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--on-gold);font:800 20px/32px var(--display);text-align:center;
  border:2px solid var(--glaze);box-shadow:0 4px 12px rgba(10,20,50,.3);animation:bob 1.6s ease-in-out infinite}
.npc-tag .mark:empty{display:none}
.npc-tag .nm{font:700 13px/1 var(--display);background:var(--rim);color:var(--glaze);padding:5px 10px 3px;border-radius:999px;white-space:nowrap}
@keyframes bob{50%{transform:translateY(-5px)}}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:var(--top);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#hud>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:6px 14px 4px 10px;border-radius:999px;font:800 21px/1 var(--display);color:var(--rim)}
.hud-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.counts{display:flex;gap:12px;align-items:center;padding:7px 12px;border-radius:999px;cursor:pointer;font:700 15px/1 var(--body)}
.cnt{display:inline-flex;align-items:center;gap:5px;color:var(--c);font-variant-numeric:tabular-nums}
.cnt i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.coins{display:flex;gap:6px;align-items:center;padding:7px 12px;border-radius:999px;font:700 15px/1 var(--body);font-variant-numeric:tabular-nums}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE9A8,var(--gold) 60%,#B07F12)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font:800 18px/1 var(--display);color:var(--rim)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.small{width:32px;height:32px;border:2px solid var(--rim);background:var(--glaze);box-shadow:none}

#tracker{position:absolute;z-index:9;left:max(16px, env(safe-area-inset-left, 0px));top:calc(var(--top) + 54px);width:min(290px, calc(100% - 32px));padding:20px 16px 12px}
#tracker h2,.sheet h2,.modal h2,.pop h2{margin:0;font:800 19px/1.1 var(--display);color:var(--rim);display:flex;align-items:baseline;gap:8px}
h2 small{font:400 13px/1 var(--body);color:var(--ink-2)}
h2 .w{font:inherit}
#tasks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:14px;line-height:1.35}
#tasks li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
#tasks li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);transform:translateY(-1px)}
#tasks li.muted{color:var(--ink-2)}
#tasks li.muted::before{background:var(--ink-2)}
#unmet{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
#tracker-toggle{display:none}
.chip{font:700 14px/1.2 var(--body);color:var(--c);background:var(--t);border:0;border-bottom:2px solid var(--c);border-radius:5px;padding:1px 5px;cursor:pointer}

#minimap{position:absolute;z-index:9;right:max(16px, env(safe-area-inset-right, 0px));top:calc(var(--top) + 56px);width:136px;height:136px;border-radius:50%;
  border:2px solid var(--rim);box-shadow:var(--shadow);background:var(--glaze)}

#prompt{position:absolute;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(var(--bottom) + 10px);display:flex;align-items:center;gap:8px;
  padding:8px 14px;border-radius:999px;font:700 15px/1.2 var(--body);white-space:nowrap}
kbd{font:800 13px/1 var(--display);background:var(--rim);color:var(--glaze);border-radius:6px;padding:4px 7px 2px}
#bagbar{position:absolute;z-index:11;left:max(16px, env(safe-area-inset-left, 0px));bottom:var(--bottom);display:flex;gap:6px;align-items:center;padding:6px 12px 6px 14px;border-radius:999px;font:700 14px/1 var(--body);cursor:pointer}
#bagbar .bag-name{font:800 15px/1 var(--display);color:var(--rim);margin-right:2px}
#bag-slots{display:flex;gap:2px}
#bag-slots img{width:30px;height:30px;border-radius:8px;background:var(--glaze-2)}
#bag-count{color:var(--ink-2);font-variant-numeric:tabular-nums;margin-left:2px}
#bag{top:auto;right:auto;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(var(--bottom) + 58px)}
#bag-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 6px;border-radius:12px;background:var(--glaze-2);min-width:0}
.slot img{width:44px;height:44px}
.slot.empty{justify-content:center;min-height:72px;color:var(--ink-2);font-size:13px;background:transparent;border:2px dashed var(--glaze-2)}
#d-leave{padding:5px 11px;font-size:13px}
#xp{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px}
#xp-level{font:800 15px/1 var(--display);color:var(--rim);white-space:nowrap}
#xp-level .w{font:inherit}
.xpbar{flex:1;height:10px;border-radius:999px;background:var(--glaze-2);overflow:hidden;min-width:40px}
.xpbar i{display:block;height:100%;width:0;background:var(--gold);border-radius:999px;transition:width .4s}
#xp-num{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.ghost{border:2px solid var(--rim);background:transparent;color:var(--rim);border-radius:999px;padding:5px 10px;font:700 13px/1 var(--body);cursor:pointer}

/* dialogue */
#dialogue{position:absolute;z-index:20;left:50%;transform:translateX(-50%);bottom:var(--bottom);
  width:min(780px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));padding:24px 22px 16px}
.d-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#d-name{font:800 20px/1 var(--display);color:var(--rim)}
#d-role{font-size:14px;color:var(--ink-2)}
#d-step{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#d-line{font:400 clamp(20px, 2.5vw, 26px)/1.55 var(--body);margin:10px 0 4px;min-width:0}
.w{font:inherit;font-weight:700;color:var(--c);background:var(--t);border:0;border-bottom:2px solid var(--c);border-radius:5px;padding:0 4px;margin:0 1px;cursor:pointer}
.w:hover{filter:brightness(1.08);box-shadow:0 0 0 2px var(--t)}
#d-line .w,#d-line .p{display:inline-block;animation:rise .32s ease-out both;animation-delay:calc(var(--i) * 26ms)}
#d-line .p{white-space:pre}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
#d-tr{margin:2px 0 6px;color:var(--ink-2);font-size:16px;line-height:1.4}
#d-tr::before{content:"EN";font:800 11px/1 var(--display);letter-spacing:.08em;background:var(--glaze-2);color:var(--ink-2);border-radius:4px;padding:3px 5px 1px;margin-right:8px;vertical-align:2px}
.d-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.d-actions .spacer{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--rim);background:var(--glaze);color:var(--rim);border-radius:999px;padding:7px 12px;font:700 14px/1 var(--body);cursor:pointer}
.chip-btn svg{width:16px;height:16px}
.chip-btn[aria-pressed="true"]{background:var(--rim);color:var(--glaze)}
.primary{background:var(--rim);color:var(--glaze);font:800 17px/1 var(--display);border:0;border-radius:12px;padding:12px 20px 9px;cursor:pointer}
.primary:hover{filter:brightness(1.1)}
.w.answer{font:700 22px/1.2 var(--body);padding:6px 16px 4px;border-radius:10px}
#d-tip{position:absolute;left:18px;top:-46px;background:var(--gold);color:var(--on-gold);font:700 14px/1.2 var(--body);padding:9px 12px;border-radius:10px;box-shadow:var(--shadow);animation:bob 1.6s ease-in-out infinite}
#d-tip::after{content:"";position:absolute;left:26px;bottom:-7px;border:8px solid transparent;border-bottom:0;border-top-color:var(--gold)}

/* word card */
#card{position:absolute;z-index:45;left:0;top:0;width:min(330px, calc(100vw - 32px));padding:14px 16px}
.c-top{display:flex;align-items:center;gap:8px}
.c-word{font:800 30px/1.1 var(--display);color:var(--c);margin-right:auto;overflow-wrap:anywhere}
.c-form{margin:6px 0 0;font-size:15px;color:var(--ink)}
.c-form b{font-weight:700}
.c-pos{margin:6px 0 0;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.c-gloss{margin:4px 0 0;font:700 19px/1.3 var(--body)}
.c-phrase{margin:8px 0 0;padding:7px 9px;border-radius:8px;background:var(--glaze-2);font-size:14px}
.c-note{margin:8px 0 0;font-size:14px;color:var(--ink-2);line-height:1.4}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg button{border:2px solid var(--c);background:var(--glaze);color:var(--c);font:700 14px/1.1 var(--body);border-radius:10px;padding:9px 4px;cursor:pointer;display:flex;gap:5px;justify-content:center;align-items:center}
.seg button .k{font:800 11px/1 var(--display);border:1.5px solid currentColor;border-radius:4px;padding:2px 4px 0}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--on-status)}
.c-meta{margin:8px 0 0;font-size:12px;color:var(--ink-2)}

/* sheets, modals, popovers */
.sheet{position:absolute;z-index:30;top:var(--top);bottom:var(--bottom);right:max(16px, env(safe-area-inset-right, 0px));width:min(410px, calc(100% - 32px));display:flex;flex-direction:column;gap:10px;padding:22px 18px 16px}
.sheet-head,.r-head{display:flex;align-items:center;gap:8px}
.sheet-head h2,.r-head h2{margin-right:auto}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--glaze-2)}
.bar span{background:var(--c);transition:width .3s}
#v-summary{margin:0;font-size:14px;color:var(--ink-2)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:2px solid var(--c, var(--rim));color:var(--c, var(--rim));background:var(--glaze);border-radius:999px;padding:5px 11px;font:700 13px/1 var(--body);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--c, var(--rim));color:var(--on-status)}
.filters button[data-f="all"][aria-pressed="true"]{color:var(--glaze)}
#v-search{width:100%;box-sizing:border-box;border:2px solid var(--glaze-2);background:var(--glaze-2);color:var(--ink);border-radius:10px;padding:9px 12px;font:400 15px/1.2 var(--body)}
#v-list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.v-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--glaze-2)}
.v-row .w{font-size:16px;justify-self:start}
.v-rank{font:700 11px/1 var(--body);color:var(--ink-2);background:var(--glaze-2);border-radius:4px;padding:2px 4px;margin-right:6px;font-variant-numeric:tabular-nums}
.v-pane{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.pager{gap:4px}
.pager button{padding:4px 7px;font-size:12px}
#f-summary{margin:0;font-size:14px}
#f-list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;min-height:0}
.f-row{display:grid;grid-template-columns:34px auto minmax(0,1fr);gap:2px 10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--glaze-2)}
.f-rank{color:var(--ink-2);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.f-row .w{font-size:16px;justify-self:start}
.f-missing{font-weight:700;font-size:16px;color:var(--ink-2);opacity:.7}
.f-gloss{font-size:14px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.f-where{grid-column:2 / -1;font-size:12px;color:var(--ink-2)}
.f-row.missing .f-where{font-style:italic}
.credit a{color:inherit}
.v-gloss{font-size:14px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.v-dots{display:flex;gap:5px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;padding:0}
.dot[aria-pressed="true"]{background:var(--c)}
.v-empty{padding:18px 4px;color:var(--ink-2);font-size:14px;line-height:1.45}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap}
.sheet-foot .primary{font-size:15px;padding:10px 14px 8px}

.modal{position:absolute;z-index:35;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px, calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;padding:24px 20px 18px;box-sizing:border-box}
#r-step{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.r-card{display:grid;justify-items:center;gap:10px;text-align:center;padding:22px 0 8px}
.r-word{font:800 44px/1.05 var(--display);color:var(--c);overflow-wrap:anywhere}
.r-gloss{font:700 20px/1.3 var(--body);margin:0}
.r-pos{font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0}
.r-note{font-size:14px;color:var(--ink-2);margin:0;max-width:34ch;line-height:1.4}
.r-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.r-btns button{border:2px solid var(--c);background:var(--glaze);color:var(--c);font:800 16px/1 var(--display);border-radius:12px;padding:11px 16px 8px;cursor:pointer}
.r-btns button.fill{background:var(--c);color:var(--on-status)}

.pop{position:absolute;z-index:32;right:max(16px, env(safe-area-inset-right, 0px));top:calc(var(--top) + 54px);width:min(330px, calc(100% - 32px));padding:22px 18px 16px;display:grid;gap:10px}
.tog{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--rim)}
.rng{display:grid;gap:6px;font-size:15px}
.rng input{accent-color:var(--rim)}
.muted{color:var(--ink-2);font-size:13px;margin:0;line-height:1.4}
.danger{border:2px solid #C0392B;color:#C0392B;background:transparent;border-radius:10px;padding:8px 12px;font:700 14px/1 var(--body);cursor:pointer;justify-self:start}
.x{margin-left:auto}

/* intro */
#intro{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(180deg,transparent,var(--veil));
  padding-top:var(--top);padding-bottom:var(--bottom);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
.intro-card{width:min(560px, 100%);max-height:100%;overflow:auto;box-sizing:border-box;padding:30px 28px 24px}
.eyebrow{margin:0;font:700 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.intro-card h1{margin:6px 0 8px;font:800 clamp(44px, 9vw, 64px)/.95 var(--display);color:var(--rim);text-wrap:balance}
.intro-card h1 span{display:inline-block;color:var(--known);animation:sort 2.6s .5s ease-in-out both}
@keyframes sort{0%,22%{color:var(--new)}45%,62%{color:var(--learning)}85%,100%{color:var(--known)}}
.lede{margin:0 0 14px;font-size:17px;line-height:1.5;max-width:46ch}
.legend{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;font-size:15px}
.legend .w{justify-self:start;font-size:18px;cursor:default}
.legend b{color:var(--c)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin:0 0 16px;font-size:14px}
.keys div{display:flex;gap:8px;align-items:baseline;min-width:0}
.keys dt{font:800 13px/1 var(--display);color:var(--rim);white-space:nowrap}
.keys dd{margin:0;color:var(--ink-2)}
.start-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#start{font-size:22px;padding:14px 26px 11px}
#intro-progress{margin:0;font-size:14px;color:var(--ink-2)}

/* touch */
#touch{position:absolute;left:0;right:0;bottom:0;height:0;z-index:12}
#stick{position:absolute;left:max(20px, env(safe-area-inset-left, 0px));bottom:calc(var(--bottom) + 8px);width:118px;height:118px;border-radius:50%;
  background:var(--stick);border:2px solid var(--rim);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--rim);opacity:.85}
#act{position:absolute;right:max(20px, env(safe-area-inset-right, 0px));bottom:calc(var(--bottom) + 22px);width:88px;height:88px;border-radius:50%;border:3px solid var(--glaze);
  background:var(--rim);color:var(--glaze);font:800 17px/1 var(--display);box-shadow:var(--shadow);touch-action:none}
#act:disabled{opacity:.45}
body.touch #prompt{bottom:calc(var(--bottom) + 200px)}
body.touch #bagbar{bottom:calc(var(--bottom) + 140px)}
body.touch #bag{bottom:calc(var(--bottom) + 196px)}

#toasts{position:absolute;z-index:60;left:50%;transform:translateX(-50%);top:calc(var(--top) + 54px);display:grid;gap:8px;justify-items:center;width:min(440px, calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;padding:10px 14px;border-radius:12px;font-size:15px;line-height:1.35;display:flex;gap:8px;align-items:center;flex-wrap:wrap;animation:rise .3s ease-out both}
.toast .acts{display:flex;gap:6px}
.toast .acts button{border:2px solid var(--c);color:var(--c);background:var(--glaze);border-radius:999px;padding:4px 10px;font:700 13px/1 var(--body);cursor:pointer}
#fatal{position:absolute;inset:0;z-index:80;display:grid;place-items:center;padding:24px;text-align:center;background:var(--sky);font-size:17px;line-height:1.5}

@media (max-width: 720px){
  .brand{display:none}
  #hud{justify-content:flex-end}
  .hud-right{gap:6px;flex-wrap:nowrap}
  .counts{gap:7px;padding:7px 9px;font-size:14px}
  .coins{padding:7px 9px;font-size:14px}
  .icon-btn{width:34px;height:34px}
  .icon-btn svg{width:18px;height:18px}
  #tracker{top:calc(var(--top) + 48px)}
  #tracker{padding:16px 12px 10px;width:auto;max-width:calc(100% - 140px)}
  #tracker:not(.open) #tasks,#tracker:not(.open) #unmet{display:none}
  #xp-num{display:none}
  #tracker-toggle{display:inline;margin-left:auto;border:0;background:none;color:var(--rim);font:800 13px/1 var(--display);cursor:pointer;padding:0}
  #minimap{width:96px;height:96px;top:calc(var(--top) + 56px)}
  #dialogue{padding:20px 14px 12px}
  .legend li{grid-template-columns:96px 1fr}
  .keys{grid-template-columns:1fr}
}
@media (max-height: 520px){ #minimap{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
